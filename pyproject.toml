[project]
name = "duplifind"
version = "0.1.0"
description = "CLI do wykrywania duplikatów zdjęć (identycznych, przeskalowanych, przekompresowanych)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=12.0",
]

[project.scripts]
duplifind = "duplifind.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duplifind"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
